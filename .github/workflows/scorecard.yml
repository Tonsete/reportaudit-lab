# Madurez de la cadena de suministro con OpenSSF Scorecard.
# Corre en main y cada semana: puntúa branch-protection, permisos de
# tokens, dependencias fijadas y resto de buenas prácticas, y publica el
# resultado en el code scanning para leerlo con criterio.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Descargar el código sin credenciales persistentes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Analizar con Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          publish_results: true

      - name: Publicar resultados en code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
