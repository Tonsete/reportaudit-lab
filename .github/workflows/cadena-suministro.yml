# Pipeline de la cadena de suministro segura de ReportAudit.
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: Cadena de suministro segura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto, los jobs solo pueden LEER el repositorio.
permissions:
  contents: read

jobs:
  sonarqube-cloud:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar CodeQL para Python
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Ejecutar el análisis y publicar los resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Auditar dependencias con pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --desc

  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Gitleaks verificado
        run: python scripts/instalar_herramientas.py gitleaks

      - name: Buscar secretos en el árbol con las reglas de ReportAudit
        # Se escanea el árbol (no el historial): el historial contiene a
        # propósito las 2 credenciales ya rotadas (ver Parte O) y ese
        # hallazgo histórico queda registrado como baseline, no como puerta.
        run: ./tools/gitleaks detect --source . --config gitleaks.toml --verbose --no-git
