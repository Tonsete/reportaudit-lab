# Pipeline de la cadena de suministro segura de ReportAudit.
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: Cadena de suministro segura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto, los jobs solo pueden LEER el repositorio.
permissions:
  contents: read

jobs:
  sonarqube-cloud:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar CodeQL para Python
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Ejecutar el análisis y publicar los resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Auditar dependencias con pip-audit
        # Audita las versiones EXACTAS del lockfile (directas y transitivas)
        # sin instalarlas ni resolverlas: si no, un lockfile incoherente hace
        # fallar el job por un conflicto de pip y no por una vulnerabilidad.
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          no-deps: true
          disable-pip: true

  secretos-gitleaks:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buscar secretos en los commits
        # Escanea los commits del PR (o del push) con .gitleaks.toml (reglas
        # propias) y .gitleaksignore (credenciales ya rotadas, Parte O).
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
