# Publicación de versiones de ReportAudit.
# Al empujar una etiqueta v* se genera el SBOM de esa versión exacta,
# se firma su procedencia (Sigstore/SLSA) y se publica la Release con el
# SBOM como asset. Así un cliente puede verificar qué instaló y de dónde salió.
name: Publicar versión

on:
  push:
    tags: ["v*"]

# Mínimo privilegio + lo justo para publicar y firmar.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publicar:
    name: Release con SBOM y procedencia firmada
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de la etiqueta
        uses: actions/checkout@v7

      - name: Instalar Syft verificado
        run: python3 scripts/instalar_herramientas.py syft

      - name: Generar el SBOM de la versión
        run: ./tools/syft scan requirements.txt -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cyclonedx.json

      - name: Firmar la procedencia del SBOM SPDX
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: sbom.spdx.json

      - name: Firmar la procedencia del SBOM CycloneDX
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: sbom.cyclonedx.json

      - name: Publicar la Release con el SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ReportAudit ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}: SBOM firmado y procedencia SLSA adjuntos." \
            sbom.spdx.json sbom.cyclonedx.json
